<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tótem Institucional INACAP - AR</title>
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .header-inacap {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #D32F2F;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 13px;
      z-index: 9999;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- Encabezado Institucional -->
  <div class="header-inacap">
    INACAP - TÓTEM INTERACTIVO AR
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <!-- Imágenes y Assets del Proyecto -->
    <a-assets>
      <img id="logo-inacap" src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Logo_INACAP.png" crossorigin="anonymous">
    </a-assets>

    <!-- Marcador Hiro (Para probar en la pantalla de tu PC) -->
    <a-marker preset="hiro">
      
      <!-- Logo Oficial de INACAP Flotante arriba -->
      <a-image src="#logo-inacap" position="0 1.6 0" width="1.6" height="0.45"></a-image>

      <!-- Panel Principal Rojo Institucional -->
      <a-plane position="0 0.8 0" width="2" height="1" material="color: #1E1E1E; opacity: 0.95; border: 3px solid #D32F2F;"></a-plane>
      <a-text value="BIENVENIDO A INACAP" position="-0.85 1.15 0.01" scale="0.5 0.5 0.5" color="#FFFFFF"></a-text>
      <a-text value="Sede San Joaquin / Informatica" position="-0.85 0.95 0.01" scale="0.32 0.32 0.32" color="#FFD54F"></a-text>

      <!-- Botón 1: Malla / Carrera -->
      <a-entity id="btn-carrera" position="0 0.65 0.02" class="clickable">
        <a-plane width="1.7" height="0.25" material="color: #D32F2F;"></a-plane>
        <a-text value="1. Ing. en Informatica" position="-0.7 -0.01 0.01" scale="0.35 0.35 0.35" color="#FFFFFF"></a-text>
      </a-entity>

      <!-- Botón 2: Servicios Sede -->
      <a-entity id="btn-servicios" position="0 0.35 0.02" class="clickable">
        <a-plane width="1.7" height="0.25" material="color: #212121; opacity: 0.9;"></a-plane>
        <a-text value="2. Laboratorios y Biblioteca" position="-0.7 -0.01 0.01" scale="0.35 0.35 0.35" color="#FFFFFF"></a-text>
      </a-entity>

      <!-- Pedestal 3D Base -->
      <a-cylinder position="0 0 0" radius="0.9" height="0.05" material="color: #D32F2F;"></a-cylinder>

    </a-marker>

    <!-- Cámara con Cursor Láser Verde para cliquear -->
    <a-entity camera>
      <a-cursor raycaster="objects: .clickable" color="#00FF00" fuse="false" timeout="500"></a-cursor>
    </a-entity>
    
  </a-scene>

  <!-- Lógica de Interacción -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnCarrera = document.querySelector('#btn-carrera');
      const btnServicios = document.querySelector('#btn-servicios');

      btnCarrera.addEventListener('click', () => {
        alert('INACAP: Malla curricular centrada en Desarrollo Web, Bases de Datos e Ingenieria de Software.');
      });

      btnServicios.addEventListener('click', () => {
        alert('INACAP: Laboratorios de Computacion equipados para desarrollo y red Wi-Fi institucional.');
      });
    });
  </script>

</body>
</html>
