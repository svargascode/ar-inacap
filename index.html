<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR INACAP - Proyecto</title>
  
  <!-- Librerías de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Forzar que el video de la cámara se ajuste bien a la pantalla del celu sin zoom forzado */
    body {
      margin: 0;
      overflow: hidden;
    }
    a-scene {
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0;
    }
  </style>
</head>

<body>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <!-- Marcador por defecto 'Hiro' -->
    <a-marker preset="hiro">
      
      <!-- Objeto 3D interactivo sobre el marcador -->
      <a-box id="mi-caja" position="0 0.5 0" material="color: #D32F2F;" class="clickable"></a-box>
      
      <!-- Texto flotante -->
      <a-text value="INACAP Sede" position="-0.6 1.2 0" scale="0.8 0.8 0.8" color="#FFFFFF"></a-text>

    </a-marker>

    <!-- Cámara con cursor para detectar toques en pantalla -->
    <a-entity camera>
      <a-cursor raycaster="objects: .clickable" color="#00FF00"></a-cursor>
    </a-entity>
    
  </a-scene>

  <!-- Script simple para darle interactividad -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const caja = document.querySelector('#mi-caja');

      caja.addEventListener('click', () => {
        alert('¡Bien hecho! Tocaste el objeto interactivo de INACAP.');
        caja.setAttribute('material', 'color', '#1976D2');
      });
    });
  </script>

</body>
</html>
