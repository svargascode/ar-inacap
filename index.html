<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR INACAP - MindAR</title>
  
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Escena usando MindAR con marcador Hiro -->
  <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.mind; filterMinCF:0.0001; filterBeta:0.001;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false">
    
    <a-assets>
      <img id="card" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objeto 3D que aparecerá al detectar la imagen -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box id="mi-caja" position="0 0.4 0" depth="0.5" height="0.5" width="0.5" material="color: #D32F2F;" class="clickable"></a-box>
      <a-text value="INACAP Sede" position="-0.4 0.9 0" scale="0.6 0.6 0.6" color="#FFFFFF"></a-text>
    </a-entity>

  </a-scene>

  <!-- Script de interactividad -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const caja = document.querySelector('#mi-caja');
      caja.addEventListener('click', () => {
        alert('¡Bien hecho! Tocaste el objeto interactivo.');
        caja.setAttribute('material', 'color', '#1976D2');
      });
    });
  </script>

</body>
</html>
