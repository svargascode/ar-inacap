<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR INACAP</title>
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    /* Ocultar cualquier elemento molesto de depuración de AR.js */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      font-size: 18px;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- Pantalla de carga limpia por si acaso -->
  <div class="arjs-loader">
    <div>Cargando Realidad Aumentada, espera un toque...</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <!-- Marcador Hiro -->
    <a-marker preset="hiro">
      <a-box id="mi-caja" position="0 0.5 0" material="color: #D32F2F;" class="clickable"></a-box>
      <a-text value="INACAP Sede" position="-0.6 1.2 0" scale="0.8 0.8 0.8" color="#FFFFFF"></a-text>
    </a-marker>

    <a-entity camera>
      <a-cursor raycaster="objects: .clickable" color="#00FF00"></a-cursor>
    </a-entity>
    
  </a-scene>

  <script>
    // Apenas cargue la página, sacamos la pantalla de carga negra
    window.addEventListener('load', () => {
      const loader = document.querySelector('.arjs-loader');
      if (loader) loader.style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', () => {
      const caja = document.querySelector('#mi-caja');
      caja.addEventListener('click', () => {
        alert('¡Bien hecho! Tocaste el cubo de INACAP.');
        caja.setAttribute('material', 'color', '#1976D2');
      });
    });
  </script>

</body>
</html>
